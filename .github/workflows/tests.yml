name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q tests
      - name: Render anonymized example
        env:
          MPLBACKEND: Agg
        run: python scripts/plot_smooth_radar.py --config assets/example_config.json --outdir output/example
